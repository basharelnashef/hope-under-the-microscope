name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: "numpy==1.24.0"
          - python: "3.12"
            numpy: "numpy>=2,<3"
          - python: "3.14"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install "${{ matrix.numpy }}"
          python -m pip install -e .
      - name: Test reproduction code
        run: make test
      - name: Authenticate published results
        run: make verify-results
